[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-delivery-gates"
version = "0.1.0"
description = "Local-first, read-only delivery-gate validation for Hermes Agent."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Christian Rey Villablanca"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["delivery_gates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
